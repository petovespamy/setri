name: Aktualizácia letákov

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalácia
        run: npm install --prefix scraper
      - name: Stiahnutie nových letákov
        run: node scraper/src/run.mjs
      - name: Uloženie zmien
        if: always()
        run: |
          git config user.name "setri-bot"
          git config user.email "setri-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Aktualizácia letákov"
          git push
