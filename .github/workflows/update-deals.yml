name: Aktualizácia letákov

on:
  schedule:
    - cron: "30 4 * * *"   # každý deň o 4:30 UTC (5:30 / 6:30 na Slovensku)
  workflow_dispatch:         # dá sa spustiť aj ručne v záložke Actions
    inputs:
      ai_test:
        description: "Skúška AI čítania letáku Billa (nič sa neukladá, výsledok je v Summary)"
        type: boolean
        default: false
      reread_store:
        description: "Znova prečítať aktuálny leták jedného obchodu cez AI (prepíše ho): billa, tesco, lidl, kraj alebo drogerie101. Prázdne = nič."
        type: string
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inštalácia
        run: npm install --prefix scraper
      - name: Nástroj na čítanie PDF
        # Ak server s balíčkami nie je dostupný, skúsi to znova a nakoniec pokračuje ďalej (appka dostane aspoň čo vie bez AI čítania PDF).
        continue-on-error: true
        run: |
          command -v pdftoppm >/dev/null && exit 0
          for i in 1 2 3; do
            timeout 90 sudo apt-get -o Acquire::Retries=0 update -qq \
              && timeout 120 sudo apt-get -o Acquire::Retries=0 install -y -qq poppler-utils \
              && exit 0
            echo "Pokus $i zlyhal, skúšam znova"
            sleep 10
          done
          exit 1
      - name: Stiahnutie nových letákov
        run: node scraper/src/run.mjs ${{ inputs.reread_store != '' && format('--force {0}', inputs.reread_store) || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Skúška AI čítania letáku (Billa)
        if: ${{ always() && inputs.ai_test == true }}
        continue-on-error: true
        run: |
          node scraper/src/aiTest.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Uloženie zmien
        if: always()
        run: |
          git config user.name "setri-bot"
          git config user.email "setri-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Aktualizácia letákov"
          git push
